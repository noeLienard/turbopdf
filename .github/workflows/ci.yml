name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Rust quality components
        run: rustup component add clippy rustfmt
      - run: npm ci
      - run: npm run build:native
      - run: npm run build:wasm
      - run: npm run check
      - name: Tests on the WebAssembly engine (the fallback where no native binary exists)
        run: npm run test:wasm
      - name: In a real browser (Chromium), offline and byte-identical to the native engine
        run: node scripts/browser-smoke/run.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: PDF/A and PDF/UA conformance, checked by veraPDF
        run: |
          scripts/install-verapdf.sh "$RUNNER_TEMP/verapdf"
          VERAPDF="$RUNNER_TEMP/verapdf/verapdf" node scripts/check-pdfa.mjs
      - run: npm pack --dry-run
