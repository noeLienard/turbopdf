name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install Rust quality components
        run: rustup component add clippy rustfmt
      - run: npm ci
      - run: npm run build:native
      - run: npm run check
      - run: npm pack --dry-run
