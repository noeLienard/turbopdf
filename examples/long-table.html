<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- web font + lazy images + a 200-row table: the classic ways a PDF goes wrong -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; color: #111827; }
    h1 { margin: 0 0 8px; }
    img.hero { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: #dbeafe; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th { background: #111827; color: #fff; text-align: left; padding: 8px; }
    td { padding: 8px; border-bottom: 1px solid #e5e7eb; }
    tbody tr:nth-child(even) td { background: #f9fafb; }
  </style>
</head>
<body>
  <h1>200 orders</h1>
  <img class="hero" loading="lazy" alt=""
       src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='120'><rect width='800' height='120' fill='%232563eb'/></svg>">
  <table>
    <thead><tr><th>#</th><th>Customer</th><th>Status</th><th style="text-align:right">Amount</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    const status = ['Paid', 'Pending', 'Refunded'];
    document.getElementById('rows').innerHTML = Array.from({ length: 200 }, (_, i) =>
      `<tr><td>${i + 1}</td><td>Customer ${i + 1}</td><td>${status[i % 3]}</td><td style="text-align:right">${(19.9 + i * 3.1).toFixed(2)} €</td></tr>`
    ).join('');
  </script>
</body>
</html>
