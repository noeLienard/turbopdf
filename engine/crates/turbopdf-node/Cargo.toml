[package]
name = "turbopdf-node"
description = "Node.js binding of the TurboPDF engine (napi-rs)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
turbopdf-engine.workspace = true
serde_json.workspace = true
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
