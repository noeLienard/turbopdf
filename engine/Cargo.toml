[workspace]
resolver = "3"
members = [
  "crates/turbopdf-tree",
  "crates/turbopdf-fonts",
  "crates/turbopdf-text",
  "crates/turbopdf-layout",
  "crates/turbopdf-pdf",
  "crates/turbopdf-raster",
  "crates/turbopdf-html",
  "crates/turbopdf-markup",
  "crates/turbopdf-engine",
  "crates/turbopdf-node",
  "crates/turbopdf-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"
repository = "https://github.com/turbopdf-dev/turbopdf"

[workspace.dependencies]
# interne
turbopdf-tree   = { path = "crates/turbopdf-tree" }
turbopdf-fonts  = { path = "crates/turbopdf-fonts" }
turbopdf-text   = { path = "crates/turbopdf-text" }
turbopdf-layout = { path = "crates/turbopdf-layout" }
turbopdf-pdf    = { path = "crates/turbopdf-pdf" }
turbopdf-raster = { path = "crates/turbopdf-raster" }
turbopdf-html = { path = "crates/turbopdf-html" }
turbopdf-markup = { path = "crates/turbopdf-markup" }
turbopdf-engine = { path = "crates/turbopdf-engine" }

# données
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
ts-rs      = { version = "12", features = ["serde-compat"] }

# moteur
taffy      = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
rustybuzz  = "0.20"
hypher     = "0.1"
krilla     = { version = "0.8", default-features = false, features = ["raster-images"] }
tiny-skia  = "0.12"
base64     = "0.22"
# HTML input: the WHATWG parser of Servo
html5ever  = "0.40"
jpeg-decoder = { version = "0.3", default-features = false }
# SVG: parsed once (usvg), drawn as vectors in the PDF (krilla-svg) and rasterized for previews (resvg).
usvg       = { version = "0.47", default-features = false, features = ["text"] }
resvg      = { version = "0.47", default-features = false, features = ["text"] }
krilla-svg = "0.8"
image-webp = "0.2"
gif        = "0.14"
# à venir : napi / napi-derive = "3" (binding Node), wasm-bindgen = "0.2" (binding WebAssembly)

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# no `panic = "abort"`: inside Node (napi) or a browser (wasm) a panic must become an error, not kill the host
